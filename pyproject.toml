[project]
name = "whisper-shortcut-osx"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper",
    "pynput",
    "pyperclip",
    "sounddevice",
    "numpy",
    "rumps",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
